<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول — منصة فرص السوق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07111f;
    --card: rgba(13, 27, 46, .92);
    --line: rgba(148, 163, 184, .18);
    --text: #f4f7fb;
    --muted: #9cacbf;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    padding: 22px;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--text);
    font-family: "Tajawal", system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(34, 197, 94, .14), transparent 32rem),
      radial-gradient(circle at 88% 90%, rgba(14, 165, 233, .12), transparent 30rem),
      var(--bg);
  }
  .login-card {
    width: min(100%, 430px);
    padding: 32px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .38);
    backdrop-filter: blur(18px);
  }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    color: #06270f;
    background: linear-gradient(145deg, #4ade80, #16a34a);
    box-shadow: 0 14px 36px rgba(34, 197, 94, .25);
  }
  .brand-icon svg { width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 1.55rem; font-weight: 800; }
  .subtitle { margin: 7px 0 0; color: var(--muted); font-size: .93rem; }
  .field { margin-bottom: 15px; }
  .field label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 700; }
  .input-wrap { position: relative; }
  .input-wrap svg {
    position: absolute;
    top: 50%;
    right: 14px;
    width: 20px;
    height: 20px;
    color: #718096;
    transform: translateY(-50%);
    pointer-events: none;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    min-height: 50px;
    padding: 12px 46px 12px 14px;
    border: 1px solid var(--line);
    border-radius: 13px;
    outline: none;
    color: var(--text);
    background: rgba(3, 11, 22, .65);
    font: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 197, 94, .12); }
  .consent {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 4px 0 18px;
    color: var(--muted);
    font-size: .78rem;
    line-height: 1.65;
    cursor: pointer;
  }
  .consent input { margin-top: 4px; accent-color: var(--accent); }
  details { margin: -4px 0 15px; color: var(--muted); font-size: .76rem; }
  details summary { cursor: pointer; }
  .disclaimer { max-height: 90px; margin-top: 8px; padding: 10px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  button {
    width: 100%;
    min-height: 51px;
    border: 0;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    font: 700 1rem "Tajawal", sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(34, 197, 94, .18);
  }
  button:hover { filter: brightness(1.07); }
  .error {
    margin: 0 0 15px;
    padding: 10px 12px;
    border: 1px solid rgba(251, 113, 133, .25);
    border-radius: 10px;
    color: var(--danger);
    background: rgba(251, 113, 133, .08);
    font-size: .84rem;
  }
  .access-note { margin-top: 17px; text-align: center; color: #718096; font-size: .74rem; }
  @media (max-width: 480px) {
    body { padding: 14px; }
    .login-card { padding: 25px 20px; border-radius: 20px; }
    .brand-icon { width: 68px; height: 68px; }
  }
</style>
</head>
<body>
  <main class="login-card">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/>
          <path d="m3 12 5-4 5 3 7-7"/>
        </svg>
      </div>
      <h1>منصة فرص السوق</h1>
      <p class="subtitle">دخول المشتركين</p>
    </header>

    <form method="post" action="/lock">
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

      <div class="field">
        <label for="username">اسم المستخدم</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
          <input id="username" type="text" name="username" autocomplete="username" placeholder="أدخل اسم المستخدم" required autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" name="code" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
        </div>
      </div>

      <details>
        <summary>إخلاء المسؤولية</summary>
        <div class="disclaimer">{{ disclaimer }}</div>
      </details>
      <label class="consent">
        <input type="checkbox" name="consent" value="yes" required>
        <span>أوافق أن المنصة أداة تحليل تعليمية، وأن قرارات التداول مسؤوليتي.</span>
      </label>

      <button type="submit">تسجيل الدخول</button>
    </form>
    <div class="access-note">الوصول مخصص للمشتركين المصرح لهم فقط</div>
  </main>
</body>
</html>
