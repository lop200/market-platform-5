<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قنّاص SPX — مرصاد</title>
<style>
:root{--bg:#07111d;--card:#0e1927;--line:#263a52;--text:#f3f7fc;--muted:#91a2b8;--blue:#69b9ff;--red:#ff7380;--green:#3ed29a;--yellow:#f5c45c}*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial}.shell{width:min(1200px,100%);margin:auto;padding:10px}.top,.hero,.event,.stats{background:var(--card);border:1px solid var(--line);border-radius:15px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px}.top h1{margin:0;font-size:1.1rem}.top a{color:var(--blue);text-decoration:none}.hero{padding:17px;margin:10px 0;background:linear-gradient(135deg,#142d48,#0e1927)}.hero h2{margin:0 0 8px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:10px}.stat{padding:10px;background:#081522;border-radius:9px}.stat small{display:block;color:var(--muted)}.stat b{display:block;margin-top:4px}.events{display:grid;gap:9px;margin-top:10px}.event{padding:13px;border-right:4px solid var(--yellow)}.event.up{border-right-color:var(--green)}.event.down{border-right-color:var(--red)}.event h3{font-size:.95rem;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.metric{background:#081522;border-radius:8px;padding:8px;min-width:0}.metric small{display:block;color:var(--muted);font-size:.65rem}.metric b{display:block;margin-top:4px;overflow-wrap:anywhere}.warning{padding:10px;background:#352c16;color:#ffe3a3;border-radius:9px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}.events{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1100px){.events{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="shell">
<header class="top"><div><h1>🎯 قنّاص SPX</h1><small class="muted">سياق الأخبار الكلية والثقيلة</small></div><div><a href="/news">نبض السوق</a> · <a href="/">الرئيسية</a></div></header>
<section class="hero"><h2>Market News Context لـSPX</h2><p class="muted">يربط Fed والفائدة والتضخم والوظائف والجيوسياسة وأخبار الشركات الثقيلة. لا يعرض اتجاهًا مؤكدًا أو صفقة آلية.</p></section>
<section class="stats"><div class="stat"><small>الأحداث المؤثرة</small><b id="count">0</b></div><div class="stat"><small>عالية التأثير</small><b id="high">0</b></div><div class="stat"><small>رسمية</small><b id="official">0</b></div><div class="stat"><small>آخر تحديث</small><b id="updated">—</b></div></section>
<section class="events" id="events"><div class="empty">جارٍ قراءة سياق SPX المحفوظ…</div></section><p class="warning" id="disclaimer"></p>
</main><script>
const $=s=>document.querySelector(s),dash=v=>v==null||v===""?"—":v,metric=(l,v)=>`<div class="metric"><small>${l}</small><b>${dash(v)}</b></div>`,age=s=>s<3600?`${Math.floor(s/60)} دقيقة`:`${Math.floor(s/3600)} ساعة`;
function card(x){const cls=x.potential_direction_ar==="داعم للصعود"?"up":x.potential_direction_ar==="داعم للهبوط"?"down":"";return `<article class="event ${cls}"><h3>${x.headline}</h3><div class="grid">${metric("الحدث",x.event_type)}${metric("وقت النشر",new Date(x.published_at).toLocaleString("ar-SA"))}${metric("العمر",age(x.age_seconds))}${metric("تأثير SPX",x.spx_impact_score+"/100")}${metric("الاتجاه المحتمل",x.potential_direction_ar)}${metric("صلاحية التأثير",x.impact_valid_minutes+" دقيقة")}${metric("المصدر",x.source_name)}${metric("الموثوقية",x.reliability_score+"/100")}</div>${x.summary?`<p>${x.summary}</p>`:""}</article>`}
async function load(){const d=await(await fetch("/api/v1/dashboard/spx")).json(),rows=d.items||[];$("#count").textContent=rows.length;$("#high").textContent=rows.filter(x=>x.spx_impact_score>=80).length;$("#official").textContent=rows.filter(x=>x.is_official).length;$("#updated").textContent=d.updated_at?new Date(d.updated_at).toLocaleTimeString("ar-SA"):"—";$("#events").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">لا توجد أحداث SPX مؤثرة محفوظة حاليًا.</div>';$("#disclaimer").textContent=d.disclaimer_ar}load();
</script></body></html>
