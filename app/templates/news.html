<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>نبض السوق — مرصاد</title>
  <style>
    :root{--bg:#07111d;--card:#0e1927;--line:#263a52;--text:#f2f6fb;--muted:#91a2b8;--red:#ff7380;--yellow:#f5c45c;--green:#3ed29a;--blue:#69b9ff}
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial}.shell{width:min(1280px,100%);margin:auto;padding:10px}.top,.hero,.filters,.event,.usage{background:var(--card);border:1px solid var(--line);border-radius:15px}.top{display:flex;justify-content:space-between;align-items:center;padding:11px;position:sticky;top:4px;z-index:10}.top h1{margin:0;font-size:1.1rem}.top a,.btn{color:var(--text);background:#142438;border:1px solid var(--line);padding:9px 11px;border-radius:9px;text-decoration:none}.hero{padding:16px;margin:10px 0;background:linear-gradient(135deg,#112e48,#0e1927)}.hero h2{margin:0 0 8px}.muted{color:var(--muted)}.chips,.tabs,.checks{display:flex;flex-wrap:wrap;gap:6px}.chip,.tab{border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:.72rem}.tab{background:#101d2c;color:var(--text);cursor:pointer}.tab.active{background:#1a527c}.filters{padding:10px;margin:10px 0}.filters input{width:100%;background:#071421;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px}.events{display:grid;gap:9px}.event{padding:13px;border-right:4px solid var(--yellow)}.event.high{border-right-color:var(--red)}.event.official{border-right-color:var(--blue)}.event.supportive{border-right-color:var(--green)}.head{display:flex;justify-content:space-between;gap:8px;align-items:start}.head h3{font-size:.95rem;margin:0;line-height:1.5}.badge{font-size:.65rem;padding:5px 7px;border-radius:999px;background:#243246;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}.metric{background:#081522;border-radius:8px;padding:8px;min-width:0}.metric small{display:block;color:var(--muted);font-size:.63rem}.metric b{display:block;margin-top:4px;overflow-wrap:anywhere}.summary{line-height:1.7;color:#d3dce7}.warning{padding:9px;border-radius:8px;background:#352c16;color:#ffe2a0}.event a{color:var(--blue)}.usage{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:10px;margin:10px 0}.empty{text-align:center;padding:30px;color:var(--muted)}@media(min-width:760px){.events{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.usage{grid-template-columns:repeat(6,1fr)}}@media(min-width:1150px){.events{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>🛰️ نبض السوق</h1><small class="muted">Finnhub + SEC EDGAR + X الموثوق فقط</small></div><div><a href="/spx">قنّاص SPX</a> <a href="/">الرئيسية</a></div></header>
  <section class="hero"><h2>أهم الأخبار المؤثرة بدون ضوضاء</h2><p class="muted">لا تُعرض المصادر غير الموثوقة في التحليل الرئيسي، ولا يُعامل الخبر وحده كإشارة دخول.</p><div class="chips" id="status"></div></section>
  <nav class="tabs" aria-label="تصنيف الأخبار"><button class="tab active" data-filter="all">أهم خبر الآن</button><button class="tab" data-filter="market">أخبار السوق</button><button class="tab" data-filter="company">أخبار الشركات</button><button class="tab" data-filter="watchlist">أخبار قائمة المراقبة</button><button class="tab" data-filter="spx">أخبار SPX</button><button class="tab" data-filter="official">أخبار رسمية</button><button class="tab" data-filter="x">منشورات X الموثوقة</button><button class="tab" data-filter="sec">SEC Filings</button><button class="tab" data-filter="urgent">أخبار عاجلة</button></nav>
  <section class="filters"><input id="search" placeholder="ابحث بالرمز أو العنوان"><div class="checks"><button class="btn" id="refresh">تحديث المصادر</button></div></section>
  <section class="usage" id="usage"></section><section class="events" id="events"><div class="empty">جارٍ قراءة آخر أخبار محفوظة…</div></section>
</main><script>
const $=s=>document.querySelector(s),dash=v=>v==null||v===""?"—":v;let items=[],active="all";
const metric=(l,v)=>`<div class="metric"><small>${l}</small><b>${dash(v)}</b></div>`;
const age=s=>s<60?`${s}ث`:s<3600?`${Math.floor(s/60)}د`:s<86400?`${Math.floor(s/3600)}س`:`${Math.floor(s/86400)}ي`;
function match(x){if(active==="market")return x.market_scope==="market";if(active==="company")return x.market_scope==="company";if(active==="watchlist")return x.is_watchlist;if(active==="spx")return ["fed","inflation","employment","interest_rates","geopolitical","macro"].includes(x.event_type);if(active==="official")return x.is_official;if(active==="x")return x.source_type==="x";if(active==="sec")return x.source_type==="sec";if(active==="urgent")return (x.urgency_score??-1)>=80;return true}
function score(x){return x==null?"Unknown / Unscored":x+"/100"}
function card(x){const cls=x.is_official?"official":(x.impact_score??-1)>=80?"high":x.sentiment==="positive"?"supportive":"";return `<article class="event ${cls}"><div class="head"><h3>${x.headline}</h3><span class="badge">${x.is_official?"رسمي":x.reliability_score==null?"غير مصنف":x.reliability_score<60?"غير مؤكد":"موثوق"}</span></div><p class="summary">${x.summary||x.headline}</p><div class="grid">${metric("المصدر",x.source_name)}${metric("الرمز",(x.symbols||[]).join("، ")||"السوق")}${metric("العمر",age(x.age_seconds))}${metric("نوع الحدث",x.event_type)}${metric("درجة التأثير",score(x.impact_score))}${metric("الموثوقية",score(x.reliability_score))}${metric("الاستعجال",score(x.urgency_score))}${metric("علاقته بالفرصة",x.relation_reason_ar||"يُراجع مع التحليل الفني")}</div>${x.impact_reason_ar?`<p>سبب التأثير: ${x.impact_reason_ar}</p>`:""}${x.reliability_reason_ar?`<p>سبب الثقة: ${x.reliability_reason_ar}</p>`:""}${x.status_message_ar?`<p class="warning">${x.status_message_ar}</p>`:""}${x.confirming_sources?.length?`<p>مصادر تؤكد الخبر: ${x.confirming_sources.map(s=>s.source_name).join("، ")}</p>`:""}${x.source_url?`<a href="${x.source_url}" target="_blank" rel="noopener noreferrer">فتح المصدر الأصلي</a>`:""}</article>`}
function render(){const q=$("#search").value.trim().toLowerCase(),rows=items.filter(x=>match(x)&&(!q||x.headline.toLowerCase().includes(q)||(x.symbols||[]).join(" ").toLowerCase().includes(q)));$("#events").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">لا توجد أخبار مطابقة في البيانات المحفوظة.</div>'}
async function load(){const d=await(await fetch("/api/v1/dashboard/news")).json();items=d.items||[];$("#status").innerHTML=Object.entries(d.source_status||{}).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join("")+`<span class="chip">${d.is_stale?"آخر بيانات محفوظة":"بيانات محفوظة حديثة"}</span>`;const u=d.usage||{};$("#usage").innerHTML=[["news_api_calls",u.news_api_calls],["x_reads",u.x_reads],["sec_requests",u.sec_requests],["cache_hits",u.cache_hits],["openai_calls",u.openai_calls],["estimated_cost","$"+Number(u.estimated_cost||0).toFixed(4)]].map(([l,v])=>metric(l,v||0)).join("");render()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});$("#search").oninput=render;$("#refresh").onclick=async()=>{await fetch("/api/v1/dashboard/refresh-news",{method:"POST"});setTimeout(load,4000)};load();
</script></body></html>
