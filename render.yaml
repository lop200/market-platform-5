databases:
  - name: market-platform-db
    plan: free
    databaseName: market_platform
    postgresMajorVersion: "16"

services:
  - type: web
    name: market-platform
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: market-platform-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: alpaca
      - key: ALPACA_FEED
        value: iex
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_DAILY_BUDGET_USD
        value: "1.00"
      - key: STOCK_MIN_PRICE
        value: "2"
      - key: STOCK_MAX_PRICE
        value: "10"
      - key: API_KEY
        sync: false
      - key: ACCESS_CODE_MAIN
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
