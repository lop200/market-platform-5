databases:
  - name: market-platform-db
    plan: free
    databaseName: market_platform
    postgresMajorVersion: "16"

services:
  - type: web
    name: market-platform
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: market-platform-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: alpaca
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: sip
      - key: ALPACA_OVERNIGHT_FEED
        value: boats
      - key: ALPACA_OPTIONS_FEED
        value: opra
      - key: OPTIONS_ENABLED
        value: "false"
      - key: OPTIONS_MIN_DTE
        value: "7"
      - key: OPTIONS_MAX_DTE
        value: "30"
      - key: OPTIONS_MAX_QUOTE_AGE_SECONDS
        value: "30"
      - key: OPTIONS_MAX_SPREAD_PCT
        value: "12"
      - key: OPTIONS_MIN_VOLUME
        value: "10"
      - key: OPTIONS_MIN_OPEN_INTEREST
        value: "100"
      - key: OPTIONS_CONTRACT_LIMIT
        value: "3"
      - key: OPTIONS_MIN_ABS_DELTA
        value: "0.35"
      - key: OPTIONS_MAX_ABS_DELTA
        value: "0.65"
      - key: OPTIONS_MAX_OTM_PCT
        value: "8"
      - key: OPTIONS_MAX_CAPITAL_PCT
        value: "35"
      - key: OPTIONS_MAX_PREMIUM_LOSS_PCT
        value: "35"
      - key: OPTIONS_EARNINGS_RISK_DAYS
        value: "7"
      - key: EARNINGS_PROVIDER
        value: finnhub
      - key: EARNINGS_CACHE_SECONDS
        value: "14400"
      - key: EARNINGS_TODAY_CACHE_SECONDS
        value: "3600"
      - key: EARNINGS_CALENDAR_LIMIT
        value: "120"
      - key: EARNINGS_ENRICHMENT_LIMIT
        value: "24"
      - key: EARNINGS_REVIEW_DAYS
        value: "10"
      - key: EARNINGS_NO_NEW_ENTRY_DAYS
        value: "2"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_DAILY_BUDGET_USD
        value: "1.00"
      - key: API_KEY
        sync: false
      - key: ACCESS_CODE_MAIN
        sync: false
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_PROVIDER
        value: finnhub
      - key: SEC_NEWS_ENABLED
        value: "true"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_SECONDS
        value: "600"
      - key: X_API_BEARER_TOKEN
        sync: false
      - key: X_NEWS_ENABLED
        value: "false"
      - key: X_DAILY_READ_LIMIT
        value: "100"
      - key: X_MAX_POSTS_PER_QUERY
        value: "10"
      - key: X_ALLOWED_ACCOUNTS
        value: ""
      - key: X_ALLOWED_KEYWORDS
        value: ""
      - key: X_CACHE_SECONDS
        value: "300"
